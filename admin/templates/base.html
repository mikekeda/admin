<!DOCTYPE html>
<html lang="en">
  <head>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="{{ STATIC_URL }}node_modules/@materializecss/materialize/dist/css/materialize.min.css"/>
    {% block css %}{% endblock %}
    <link type="text/css" rel="stylesheet" href="{{ STATIC_URL }}css/style.css"/>

    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}Admin{% endblock %}</title>
    <meta name="description" content="{% block description %}Site Administration{% endblock %}">
    <META name="robots" content="noindex,nofollow">
  </head>

  <body class="grey lighten-5">
    <nav class="blue-grey darken-4">
      <div class="nav-wrapper container">
        <a href="/" id="logo-container" class="brand-logo hide-on-med-and-down">Admin</a>
        <ul class="right">
          <li class="{% if request.path == '/about' %}active{% endif %}">
            <a href="/about" class="{% if request.path == '/about' %}active{% else %}grey-text{% endif %}">About</a>
          </li>
          {% if request.ctx.user %}
          <li class="{% if request.path == '/metrics' %}active{% endif %}">
            <a href="/metrics" class="{% if request.path == '/metrics' %}active{% else %}grey-text{% endif %}">Metrics</a>
          </li>
          <li class="{% if request.path == '/logs' %}active{% endif %}">
            <a href="/logs" class="{% if request.path == '/logs' %}active{% else %}grey-text{% endif %}">Logs</a>
          </li>
          <li>
            <form class="logout-form" method="post" action="/logout">
              <button type="submit" class="grey-text">Logout</button>
            </form>
          </li>
          {% else %}
          <li class="{% if request.path == '/login' %}active{% endif %}">
            <a href="/login" class="{% if request.path == '/login' %}active{% else %}grey-text{% endif %}">Login</a>
          </li>
          {% endif %}
        </ul>
        <h1 class="center text-uppercase h2 hide-on-small-only"><wbr>{% block page_title %}{% endblock %}</h1>
      </div>
    </nav>

    {% block body %}{% endblock %}

    <footer class="page-footer orange no-padding">
      <div class="footer-copyright">
        <div class="container">
          Made by <a class="orange-text text-lighten-3" href="mailto:mriynuk@email.com">Mike</a>
        </div>
      </div>
    </footer>

    <script src="{{ STATIC_URL }}node_modules/@materializecss/materialize/dist/js/materialize.min.js"></script>
    {% block script %}{% endblock %}
    <script src="{{ STATIC_URL }}js/main.js"></script>
  </body>
</html>
